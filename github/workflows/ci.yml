name: EuroJackpot CI

on:
  push:
  pull_request:

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          files = sorted(Path(".").glob("*.py"))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files.")
          PY

      - name: Jackpot-state self-test
        run: python run_eurojackpot_jackpot_state_selftest_v3_5.py

      - name: Independent verifier
        run: python eurojackpot_independent_verifier_v3_4.py --root .

      - name: Quick one-command workflow
        run: python eurojackpot_one_click_v3_7.py --engine-mode audited --db EuroJackpot_CI.sqlite
